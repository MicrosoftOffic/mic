.login-container {
    width: 350px;        /* adjust as needed */
    padding: 30px;
    background: #ffffff;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    text-align: center;
    padding: 30px 35px 25px;
}

.header {
    background: #d9d9d9;
    border-radius: 8px;
    padding: 18px;
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 25px;
}

.header img {
    width: 42px;
}

.header h1 {
    font-size: 28px;
    font-weight: bold;
    color: #000;
}

.instructions {
    font-size: 14px;
    color: #000;
    margin-bottom: 10px;
    font-weight: 600; /* medium bold */
}

.verified {
    display: flex;
    justify-content: center;  /* horizontal center */
    align-items: center;      /* vertical alignment */
    gap: 8px;
    color: #2e8b1f;
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 10px;

}

input[type="email"],
input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 12px;
    border: 2px solid #cfcfcf;
    border-radius: 2px;
    font-size: 15px;
    font-weight: 500; /* bold text */
    color: #333;
}


input::placeholder {
    color: #8a8a8a;
}

input:focus {
    outline: none;
    border-color: #5b9bd5;
}

.login-button {
    background: #4f8edc;
    color: #ffffff;
    padding: 12px 25px;
    font-size: 16px;
    font-weight: 400; /* bold */
    border: none;
    border-radius: 4px;
    cursor: pointer;
    margin-top: 8px;
}


.login-button:hover {
    background: #3f78bc;
}

.security {
    display: flex;
    justify-content: center;
    margin-top: 18px;
}

.security img {
    width: 85px;
}

.footer {
    text-align: center;
    margin-top: 22px;
    font-size: 14px;
    color: #000;
    font-weight: 600;

}
</style>
